name: NABZ Instagram weekly pack

# Builds Persian Reels for «نبض معما», publishes them through Buffer,
# and persists durable publication claims.
#
# The workflow never logs in directly to Instagram.
# Buffer remains the official publishing path.

on:
  workflow_dispatch:
    inputs:
      week:
        description: "Monday of the week (YYYY-MM-DD). Empty = next Monday"
        required: false
        default: ""
        type: string

      per_day:
        description: "Reels per day"
        required: true
        default: "2"
        type: choice
        options:
          - "2"
          - "3"

      buffer_max:
        description: "Most reels to send to Buffer in this run"
        required: true
        default: "1"
        type: choice
        options:
          - "1"

  schedule:
    # One daily run, Tehran 19:00
    - cron: "30 15 * * *"

concurrency:
  group: nabz-ig-pack
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      skip: ${{ steps.check.outputs.skip }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Is next week's pack already complete?
        id: check
        env:
          NABZ_PACK_WEEK: ${{ inputs.week }}
        run: |
          python3 scripts/ig_pack_guard.py

  pack:
    needs: guard
    if: needs.guard.outputs.skip != 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 300

    env:
      GH_TOKEN: ${{ github.token }}

      NABZ_PACK_WEEK: ${{ inputs.week }}
      NABZ_PACK_PER_DAY: ${{ inputs.per_day || '2' }}
      NABZ_VOICE_CHECK_TRIES: "4"

      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore voice cache
        uses: actions/cache@v4
        with:
          path: .tts_cache
          key: tts-${{ github.run_id }}
          restore-keys: |
            tts-

      - name: Install caption fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -q \
            fonts-dejavu-core \
            fonts-liberation2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-cinematic.txt

      - name: Build the weekly pack
        run: |
          python -m src.ig_pack

      - name: Persist pack state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -f content/ig_pack_state.json ]; then
            echo "No pack state yet."
            exit 0
          fi

          git add content/ig_pack_state.json

          if [ -f review/pron_learned.json ]; then
            git add review/pron_learned.json
          fi

          if git diff --cached --quiet; then
            echo "No pack state changes."
            exit 0
          fi

          git commit -m "chore(ig-pack): record weekly pack progress [skip ci]"

          git pull --rebase --autostash

          git push origin main

  buffer:
    # Runs after the pack, including when the pack is skipped.
    # The guarded adapter blocks blind retries when the previous Buffer
    # mutation has an unknown outcome.
    needs:
      - guard
      - pack

    if: always()

    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GH_TOKEN: ${{ github.token }}

      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      REELS_PAT: ${{ secrets.REELS_PAT }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      NABZ_BUFFER_MAX_NEW: ${{ inputs.buffer_max || '1' }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Get latest pack state
        run: |
          git pull --rebase --autostash

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Buffer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate guarded Buffer modules
        run: |
          python -m py_compile \
            src/atomic_state.py \
            src/idempotency.py \
            src/production_state.py \
            src/guarded_buffer.py

      - name: Send finished reels to Buffer through guarded adapter
        run: |
          python -m src.guarded_buffer

      - name: Persist Buffer state and publication claims
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f content/ig_buffer_state.json ]; then
            git add content/ig_buffer_state.json
          fi

          if [ -f content/ig_stats.json ]; then
            git add content/ig_stats.json
          fi

          if [ -f review/ig_weekly.md ]; then
            git add review/ig_weekly.md
          fi

          if [ -f content/publication_claims.json ]; then
            git add content/publication_claims.json
          fi

          if git diff --cached --quiet; then
            echo "No Buffer state changes."
            exit 0
          fi

          git commit -m "chore(ig-buffer): record guarded Buffer publication state [skip ci]"

          git pull --rebase --autostash

          git push origin main
