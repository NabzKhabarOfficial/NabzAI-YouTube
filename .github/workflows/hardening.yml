name: Offline hardening checks

on:
  push:
    branches:
      - main
      - "brain/**"

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile hardening modules
        run: |
          python -m py_compile \
            src/atomic_state.py \
            src/idempotency.py \
            scripts/record_story_after_upload.py

      - name: Run hardening regression tests
        env:
          PYTHONPATH: .
        run: |
          python -m unittest \
            tests.test_atomic_state \
            tests.test_idempotency \
            -v
