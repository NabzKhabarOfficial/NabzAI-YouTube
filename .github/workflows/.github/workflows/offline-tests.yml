name: NabzAI-YouTube Offline Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nabz-ai-youtube-offline-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Instagram and YouTube offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONPATH: .
      NABZ_VOICE_CHECK: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-cinematic.txt

      - name: Compile source and Instagram packages
        run: |
          python -m compileall -q src scripts instagram

      - name: Validate Instagram Story calendar
        run: |
          python -m instagram.runner --check

      - name: Run Instagram due-slot check
        run: |
          python -m instagram.runner --due

      - name: Run offline regression tests
        run: |
          python -m unittest discover -s tests -v
