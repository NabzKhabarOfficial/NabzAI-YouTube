name: YouTube first comment

on:
  workflow_dispatch:

concurrency:
  group: yt-comment
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install google-api-python-client google-auth

      - name: Post first comment on the newest Short
        run: |
          python -m src.yt_comment

      - name: Save comment state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f content/yt_comments.json ]; then
            git add content/yt_comments.json
          fi
          if git diff --cached --quiet; then
            echo "No comment state changes."
          else
            git commit -m "chore: record YouTube comment [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
