name: NABZ Instagram top-up (bank text, catch-up plan, daily health)

# Nov 18 2026: the daily pack finished green in 0.3 s and built nothing for four days. Two holes:
# the Persian bank held no unused story that also has an English entry (a batch's inline Persian
# text was never merged), and a week that never got a plan stayed empty for ever because the pack
# only ever plans the next Monday. This workflow closes both without touching ig-pack.yml:
#   18:30 Tehran (15:00 UTC) - merge the batch text and plan the nights still ahead;
#   22:30 Tehran (19:00 UTC) - fail when the pack built nothing today and Buffer has nothing due.
# Both jobs are idempotent: a week that already has a plan and a merged bank are left untouched.

on:
  schedule:
    - cron: "0 15 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:

concurrency:
  group: nabz-ig-topup
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  topup:
    if: github.event.schedule != '0 19 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Merge batch text into the banks and plan the nights still ahead
        run: python3 scripts/plan_catchup.py

      - name: Persist the banks and the plan
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/mysteries_fa.json content/story_notes_fa.json content/ig_pack_state.json

          if git diff --cached --quiet; then
            echo "No bank or plan changes."
            exit 0
          fi

          git commit -m "chore(ig-pack): merge batch text and plan the nights still ahead [skip ci]"
          git pull --rebase --autostash
          git push origin main

  health:
    if: github.event.schedule == '0 19 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # A run that built nothing and queued nothing must be red, never a silent empty day.
      - name: Nothing built today and nothing queued is a failure
        run: python3 scripts/pack_health.py
