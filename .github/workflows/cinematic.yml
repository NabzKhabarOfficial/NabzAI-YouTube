name: NabzAI Cinematic Short

on:
  workflow_dispatch:
    inputs:
      quality:
        description: "Cinematic generation profile"
        required: true
        default: "free"
        type: choice
        options:
          - free

concurrency:
  group: nabz-ai-cinematic
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cinematic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-cinematic.txt

      - name: Regression tests
        run: python -m unittest discover -s tests -v

      - name: Verify Hugging Face token is present
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN"
          echo "HF_TOKEN is configured (value is not printed)."

      - name: Generate cinematic short film
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m src.cinematic_short

      - name: Cinematic technical quality gate
        run: |
          test -f output/cinematic-short/final_film.mp4
          test -f output/cinematic-short/quality.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          root = Path("output/cinematic-short")
          report = json.loads((root / "quality.json").read_text(encoding="utf-8"))
          assert report["gates"]["passed"] is True
          assert report["gates"]["photorealistic_prompt_contract"] is True
          assert report["gates"]["character_reference_required"] is True
          assert report["gates"]["story_structure_required"] is True
          assert report["gates"]["persian_dialogue_required"] is True
          assert report["gates"]["audio_stream_required"] is True
          assert report["gates"]["video_stream_required"] is True
          assert report["duration_seconds"] >= 10

          film = root / "final_film.mp4"
          probe = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries",
               "stream=codec_type,width,height,r_frame_rate",
               "-of", "json", str(film)],
              capture_output=True, text=True
          )
          assert probe.returncode == 0, probe.stderr
          streams = json.loads(probe.stdout)["streams"]
          assert any(s.get("codec_type") == "video" for s in streams)
          assert any(s.get("codec_type") == "audio" for s in streams)
          print("Cinematic technical gate: PASS")
          PY

      - name: Upload final film
        uses: actions/upload-artifact@v4
        with:
          name: nabz-ai-cinematic-short
          path: output/cinematic-short/
          retention-days: 7
