name: NabzAI-YouTube
# production-safe YouTube pipeline
# free-first: scheduled generation; upload only when YOUTUBE_TOKEN is explicitly configured

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - short
  push:
    branches:
      - main
      - next-gen-animation
  schedule:
    - cron: "30 8 * * *"

concurrency:
  group: nabz-ai-youtube
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-cinematic.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Build scheduled cinematic episode
        if: github.event_name == 'schedule'
        run: |
          test -n "$AGNES_API_KEY"
          python -m src.cinematic_short

      - name: Build manual preview
        if: github.event_name != 'schedule'
        env:
          MANUAL_MODE: ${{ inputs.mode || 'test' }}
        run: python -m src.main --mode "$MANUAL_MODE"

      - name: Upload scheduled episode to YouTube
        if: github.event_name == 'schedule' && env.YOUTUBE_TOKEN != ''
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          python - <<'PY'
          import json, glob, os
          from src.youtube_uploader import upload_video
          videos = glob.glob("output/*/video.mp4")
          if not videos:
              raise SystemExit("No generated video found.")
          video = videos[0]
          folder = os.path.dirname(video)
          meta = json.load(open(os.path.join(folder, "metadata.json"), encoding="utf-8"))
          video_id = upload_video(video, meta["title"], meta["description"], meta.get("tags", []), os.environ["YOUTUBE_TOKEN"], privacy_status="public", category_id="27")
          print("YOUTUBE_VIDEO_ID:", video_id)
          PY

      - name: Persist scheduled topic state
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/published.json
          if git diff --cached --quiet; then
            echo "No topic state changes to commit."
          else
            git commit -m "chore: record scheduled NABZ AI topic"
            git push
          fi

      - name: Verify generated artifacts
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            test -f output/cinematic-short/final_film.mp4
            test -f output/cinematic-short/quality.json
            python - <<'PY'
            import json, subprocess
            root="output/cinematic-short"
            report=json.load(open(root+"/quality.json", encoding="utf-8"))
            assert report["gates"]["passed"] is True
            assert report["duration_seconds"] >= 12
            probe=subprocess.run(["ffprobe","-v","error","-show_entries","stream=codec_type","-of","json",root+"/final_film.mp4"],capture_output=True,text=True)
            streams=json.loads(probe.stdout)["streams"]
            assert any(s["codec_type"]=="video" for s in streams)
            assert any(s["codec_type"]=="audio" for s in streams)
            print("Cinematic artifact gate: PASS")
            PY
          else
            test -f output/*/video.mp4
            test -f output/*/thumbnail.jpg
            test -f output/*/quality.json
            echo "Manual preview artifact gate: PASS"
          fi

      - name: Upload preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nabz-ai-youtube-preview
          path: output/
          retention-days: 3
