name: NabzAI-YouTube
# Daily NABZ Mysteries Shorts (vertical, ~45 s) + optional cinematic/manual modes.
# Scheduled uploads are always PRIVATE: review in YouTube Studio, then publish.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        required: true
        default: "mystery"
        type: choice
        options:
          - mystery
          - cinematic
          - test
          - short
      visibility:
        description: "YouTube visibility"
        required: true
        default: "private"
        type: choice
        options:
          - private
          - unlisted
          - public
      story_id:
        description: "Optional mystery id (empty = next in line)"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "30 8 * * *"

concurrency:
  group: nabz-ai-youtube
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODE: ${{ github.event_name == 'schedule' && 'mystery' || inputs.mode }}
      YOUTUBE_VISIBILITY: ${{ github.event_name == 'schedule' && 'private' || inputs.visibility }}
      YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install caption fonts
        run: sudo apt-get install -y -q fonts-dejavu-core fonts-liberation2 || true

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-cinematic.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Build NABZ Mysteries short
        if: env.MODE == 'mystery'
        env:
          NABZ_MYSTERY_ID: ${{ inputs.story_id }}
        run: python -m src.mystery_short

      - name: Build cinematic episode
        if: env.MODE == 'cinematic'
        env:
          NABZ_STORY_SLOT: ${{ github.run_number }}
        run: |
          if [ -z "$AGNES_API_KEY" ] && [ -z "$HF_TOKEN" ]; then
            echo "No cinematic provider credential configured."
            exit 1
          fi
          python -m src.cinematic_short
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("output/cinematic-short")
          report = json.loads((root/"quality.json").read_text(encoding="utf-8"))
          assert report["gates"]["passed"] is True, report
          story = json.loads((root/"story.json").read_text(encoding="utf-8"))
          nl2 = chr(10) * 2
          meta = {
              "title": f"{story['title']} | NABZ AI Cinematic Short",
              "description": story["logline"] + nl2 + "A short fictional live-action story created with AI-assisted video generation." + nl2 + "#AI #AIVideo #ShortFilm #Cinematic #NabzAI",
              "tags": ["AI", "AI video", "cinematic short film", "short film", "NABZ AI"],
              "category_id": "24",
          }
          (root/"metadata.json").write_text(json.dumps(meta, ensure_ascii=False, indent=2), encoding="utf-8")
          print("Cinematic publish gate: PASS")
          PY

      - name: Build manual preview
        if: env.MODE == 'test' || env.MODE == 'short'
        run: python -m src.main --mode "$MODE"

      - name: Upload to YouTube
        if: env.MODE == 'mystery' || env.MODE == 'cinematic'
        run: |
          if [ -z "$YOUTUBE_REFRESH_TOKEN" ] && [ -z "$YOUTUBE_TOKEN" ]; then
            echo "::warning::No YouTube credentials configured; video was built but not uploaded."
            exit 0
          fi
          if [ "$MODE" = "mystery" ]; then ROOT=output/mystery-short; else ROOT=output/cinematic-short; fi
          python -m src.youtube_uploader "$ROOT"

      - name: Persist story state
        if: env.MODE == 'mystery'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/published.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: record NABZ Mysteries story [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi

      - name: Upload generated artifacts for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nabz-ai-youtube-output
          path: |
            output/
            !output/**/work/**
          if-no-files-found: ignore
          retention-days: 2
