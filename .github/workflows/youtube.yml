name: NabzAI-YouTube

on:
  workflow_dispatch:
    inputs:
      visibility:
        description: "YouTube visibility"
        required: true
        default: "private"
        type: choice
        options:
          - private
          - unlisted
          - public

      story_id:
        description: "Optional mystery id"
        required: false
        default: ""
        type: string

  schedule:
    - cron: "30 8 * * *"
    - cron: "15 10 * * *"
    - cron: "0 12 * * *"
    - cron: "0 14 * * *"

concurrency:
  group: nabz-ai-youtube
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      skip: ${{ steps.check.outputs.skip }}

    steps:
      - name: Checkout latest state
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Already built today?
        id: check
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 scripts/guard_today.py

  build:
    needs: guard
    if: needs.guard.outputs.skip != 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      MODE: mystery

      YOUTUBE_VISIBILITY: ${{ github.event_name == 'schedule' && 'private' || inputs.visibility }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}

      # Required: do not silently fall back to Kokoro or Edge.
      NABZ_EN_TTS: "gemini"
      NABZ_REQUIRE_GEMINI_VOICE: "1"
      NABZ_RECORD_STORY: "0"

      NABZ_VOICE_CHECK_TRIES: "4"

      YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore voice cache
        uses: actions/cache@v4
        with:
          path: .tts_cache
          key: tts-${{ github.run_id }}
          restore-keys: |
            tts-

      - name: Install caption fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -q \
            fonts-dejavu-core \
            fonts-liberation2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-cinematic.txt

      - name: Confirm required voice configuration
        run: |
          if [ "$NABZ_EN_TTS" != "gemini" ]; then
            echo "::error::NABZ_EN_TTS must be gemini."
            exit 1
          fi

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY is missing."
            exit 1
          fi

          echo "Gemini TTS is required and configured."

      - name: Run offline regression tests
        run: |
          python -m unittest discover -s tests -v

      - name: Build NABZ Mysteries short
        env:
          NABZ_MYSTERY_ID: ${{ inputs.story_id }}
        run: |
          python -m src.mystery_short

      - name: Verify Gemini voice in quality report
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("output/mystery-short/quality.json")

          if not path.exists():
              print("ERROR: quality.json was not generated.")
              sys.exit(1)

          data = json.loads(path.read_text(encoding="utf-8"))
          voice = str(data.get("voice") or "")

          print("Generated voice:", voice)

          if not voice.startswith("gemini:"):
              print("ERROR: the video was not generated with Gemini TTS.")
              sys.exit(1)

          if data.get("passed") is not True:
              print("ERROR: quality gate did not pass.")
              sys.exit(1)

          print("Gemini voice and quality gate verified.")
          PY

      - name: Generate private review report
        run: |
          python scripts/review_short.py

      - name: Validate YouTube credentials
        run: |
          if [ -z "$YOUTUBE_REFRESH_TOKEN" ] && [ -z "$YOUTUBE_TOKEN" ]; then
            echo "::error::No YouTube credentials configured."
            echo "::error::Publication is blocked."
            exit 1
          fi

      - name: Upload to YouTube through guarded adapter
        run: |
          python -m src.guarded_youtube_upload output/mystery-short

      - name: Record story only after confirmed upload
        run: |
          python scripts/record_story_after_upload.py output/mystery-short

      - name: Persist confirmed publication state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            content/published.json \
            content/publication_claims.json \
            content/yt_comments.json \
            review/

          if git diff --cached --quiet; then
            echo "No state or review changes to commit."
            exit 0
          fi

          git commit -m "chore: record confirmed YouTube publication [skip ci]"

          git pull --rebase --autostash

          git push origin main

      - name: Upload generated artifacts for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nabz-ai-youtube-output
          path: |
            output/
            !output/**/work/**
          if-no-files-found: ignore
          retention-days: 2
