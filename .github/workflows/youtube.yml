name: NabzAI-YouTube
# production-safe YouTube pipeline
# free-first: scheduled generation; upload only when YOUTUBE_TOKEN is explicitly configured

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - short
          - cinematic
  push:
    branches:
      - main
      - next-gen-animation
  schedule:
    - cron: "30 8 * * *"

concurrency:
  group: nabz-ai-youtube
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-cinematic.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Build scheduled cinematic episode
        if: github.event_name == 'schedule' || inputs.mode == 'cinematic'
        run: |
          test -n "$AGNES_API_KEY"
          python -m src.cinematic_short

      - name: Build manual preview
        if: github.event_name != 'schedule' && inputs.mode != 'cinematic'
        env:
          MANUAL_MODE: ${{ inputs.mode || 'test' }}
        run: python -m src.main --mode "$MANUAL_MODE"

      - name: Verify generated artifacts
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.mode }}" = "cinematic" ]; then
            test -f output/cinematic-short/final_film.mp4
            test -f output/cinematic-short/quality.json
            python -c 'import json,subprocess; root="output/cinematic-short"; report=json.load(open(root+"/quality.json",encoding="utf-8")); assert report["gates"]["passed"] is True; assert report["duration_seconds"] >= 12; probe=subprocess.run(["ffprobe","-v","error","-show_entries","stream=codec_type","-of","json",root+"/final_film.mp4"],capture_output=True,text=True); streams=json.loads(probe.stdout)["streams"]; assert any(s["codec_type"]=="video" for s in streams); assert any(s["codec_type"]=="audio" for s in streams); print("Cinematic artifact gate: PASS")'
          else
            test -f output/*/video.mp4
            test -f output/*/thumbnail.jpg
            test -f output/*/quality.json
            echo "Manual preview artifact gate: PASS"
          fi

      - name: Upload scheduled cinematic episode to YouTube
        if: (github.event_name == 'schedule' || inputs.mode == 'cinematic') && env.YOUTUBE_TOKEN != ''
        run: |
          python -c 'import json,os; from src.youtube_uploader import upload_video; root="output/cinematic-short"; video=os.path.join(root,"final_film.mp4"); story=json.load(open(os.path.join(root,"story.json"),encoding="utf-8")); description=story["logline"]+"\\n\\nNABZ AI — cinematic short film.\\n#AI #ShortFilm #NabzAI"; video_id=upload_video(video,story["title"],description,["AI","short film","cinematic","Nabz AI"],os.environ["YOUTUBE_TOKEN"],privacy_status="private",category_id="24"); print("YOUTUBE_VIDEO_ID:",video_id)'

      - name: Persist scheduled topic state
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/published.json
          if git diff --cached --quiet; then
            echo "No topic state changes to commit."
          else
            git commit -m "chore: record scheduled NABZ AI topic"
            git push
          fi

      - name: Upload preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nabz-ai-youtube-preview
          path: output/
          retention-days: 3
