name: NabzAI-YouTube

on:
  workflow_dispatch:
    inputs:
      visibility:
        description: "YouTube visibility"
        required: true
        default: "private"
        type: choice
        options:
          - private
          - unlisted
          - public
      story_id:
        description: "Optional mystery id"
        required: false
        default: ""
        type: string

  schedule:
    # 12:00 Tehran is the main run. GitHub sometimes drops scheduled runs, so three
    # backups follow (13:45, 15:30, 17:30 Tehran). Only the first one that fires builds;
    # the guard job makes the others skip once today's Short is done.
    - cron: "30 8 * * *"
    - cron: "15 10 * * *"
    - cron: "0 12 * * *"
    - cron: "0 14 * * *"

concurrency:
  group: nabz-ai-youtube
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout latest state
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Already built today?
        id: check
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 scripts/guard_today.py

  build:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      MODE: mystery
      YOUTUBE_VISIBILITY: ${{ github.event_name == 'schedule' && 'private' || inputs.visibility }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}

      YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install caption fonts
        run: |
          sudo apt-get install -y -q fonts-dejavu-core fonts-liberation2 || true

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-cinematic.txt

      - name: Run regression tests
        run: |
          python -m unittest discover -s tests -v

      - name: Build NABZ Mysteries short
        env:
          NABZ_MYSTERY_ID: ${{ inputs.story_id }}
        run: |
          python -m src.mystery_short

      - name: Generate private review report
        run: |
          python scripts/review_short.py

      - name: Upload to YouTube
        run: |
          if [ -z "$YOUTUBE_REFRESH_TOKEN" ] && [ -z "$YOUTUBE_TOKEN" ]; then
            echo "::warning::No YouTube credentials configured; video was built but not uploaded."
            exit 0
          fi
          python -m src.youtube_uploader output/mystery-short

      - name: Build Persian Instagram reel
        continue-on-error: true
        run: |
          python -m src.reel_fa

      - name: Queue Persian reel for Instagram
        if: hashFiles('output/reel-fa/meta.json') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/igq
          mkdir -p /tmp/igq
          cp output/reel-fa/reel.mp4 output/reel-fa/cover.jpg output/reel-fa/caption.txt output/reel-fa/meta.json /tmp/igq/
          cd /tmp/igq
          git init -q -b ig-queue
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "queue: Persian reel [skip ci]"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ig-queue

      - name: Persist story state and review report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/published.json review/

          if git diff --cached --quiet; then
            echo "No state or review changes to commit."
          else
            git commit -m "chore: record story and private review report [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi

      - name: Upload generated artifacts for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nabz-ai-youtube-output
          path: |
            output/
            !output/**/work/**
          if-no-files-found: ignore
          retention-days: 2
