name: NabzAI-YouTube
# Production YouTube pipeline: build -> technical/visual gates -> optional YouTube publish.
# No paid service is required. Public publishing is explicit on manual cinematic runs.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - short
          - cinematic
      visibility:
        description: "YouTube visibility for a manual cinematic publish"
        required: true
        default: "public"
        type: choice
        options:
          - public
          - unlisted
          - private
  schedule:
    - cron: "30 8 * * *"

concurrency:
  group: nabz-ai-youtube
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-cinematic.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Build scheduled cinematic episode
        if: github.event_name == 'schedule' || inputs.mode == 'cinematic'
        run: |
          if [ -z "$AGNES_API_KEY" ] && [ -z "$HF_TOKEN" ]; then
            echo "No cinematic provider credential configured."
            exit 1
          fi
          python -m src.cinematic_short

      - name: Build manual preview
        if: github.event_name != 'schedule' && inputs.mode != 'cinematic'
        env:
          MANUAL_MODE: ${{ inputs.mode || 'test' }}
        run: python -m src.main --mode "$MANUAL_MODE"

      - name: Verify generated cinematic package
        if: github.event_name == 'schedule' || inputs.mode == 'cinematic'
        run: |
          test -f output/cinematic-short/final_film.mp4
          test -f output/cinematic-short/quality.json
          test -f output/cinematic-short/story.json
          test -f output/cinematic-short/thumbnail.jpg
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          root = Path("output/cinematic-short")
          report = json.loads((root/"quality.json").read_text(encoding="utf-8"))
          assert report["gates"]["passed"] is True
          assert report["scene_count"] == 6
          assert report["duration_seconds"] >= 23.5
          assert report["resolution"] == "1280x720"
          assert all(float(x) >= 3.0 for x in report["motion_scores"])
          film = root/"final_film.mp4"
          probe = subprocess.run(
              ["ffprobe","-v","error","-show_entries","stream=codec_type,width,height",
               "-of","json",str(film)],
              capture_output=True, text=True
          )
          assert probe.returncode == 0, probe.stderr
          streams = json.loads(probe.stdout)["streams"]
          video = next(s for s in streams if s.get("codec_type") == "video")
          assert video.get("width") == 1280 and video.get("height") == 720
          assert any(s.get("codec_type") == "audio" for s in streams)
          print("Cinematic publish gate: PASS")
          PY

      - name: Verify YouTube credentials for public/manual publish
        if: inputs.mode == 'cinematic' && inputs.visibility != 'private'
        run: |
          if [ -z "$YOUTUBE_TOKEN" ]; then
            echo "YOUTUBE_TOKEN is missing. Add the authorized YouTube OAuth JSON as a GitHub Actions secret before public/unlisted publishing."
            exit 1
          fi
          echo "YouTube OAuth token is configured."

      - name: Upload cinematic episode to YouTube
        if: (github.event_name == 'schedule' || inputs.mode == 'cinematic') && env.YOUTUBE_TOKEN != ''
        env:
          YOUTUBE_VISIBILITY: ${{ inputs.visibility || 'private' }}
        run: |
          python - <<'PY'
          import json, os
          from src.youtube_uploader import upload_video

          root = "output/cinematic-short"
          story = json.load(open(os.path.join(root, "story.json"), encoding="utf-8"))
          title = f"{story['title']} | NABZ AI Cinematic Short"
          description = (
              f"{story['logline']}\n\n"
              "A short fictional live-action story created with AI-assisted video generation.\n"
              "NABZ AI — practical AI experiments and cinematic stories.\n\n"
              "#AI #AIVideo #ShortFilm #Cinematic #NabzAI"
          )
          tags = ["AI", "AI video", "cinematic short film", "short film", "NABZ AI", "AI filmmaking"]
          video_id = upload_video(
              os.path.join(root, "final_film.mp4"),
              title,
              description,
              tags,
              os.environ["YOUTUBE_TOKEN"],
              privacy_status=os.environ.get("YOUTUBE_VISIBILITY", "private"),
              category_id="24",
              thumbnail_path=os.path.join(root, "thumbnail.jpg"),
              contains_synthetic_media=True,
          )
          print("YOUTUBE_VIDEO_ID:", video_id)
          print("YOUTUBE_VISIBILITY:", os.environ.get("YOUTUBE_VISIBILITY", "private"))
          PY

      - name: Persist scheduled topic state
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/published.json
          if git diff --cached --quiet; then
            echo "No topic state changes to commit."
          else
            git commit -m "chore: record scheduled NABZ AI topic"
            git push
          fi

      - name: Upload generated artifacts for diagnosis and review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nabz-ai-youtube-output
          path: output/
          if-no-files-found: ignore
          retention-days: 7
