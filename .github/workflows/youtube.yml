name: NabzAI-YouTube
# production-safe YouTube pipeline
# free-first: scheduled generation; upload only when YOUTUBE_TOKEN is explicitly configured

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - short
  push:
    branches:
      - main
      - next-gen-animation
  schedule:
    - cron: "30 8 * * *"

concurrency:
  group: nabz-ai-youtube
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-cinematic.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Build scheduled production preview
        if: github.event_name == 'schedule'
        run: python -m src.main --mode scheduled

      - name: Build manual preview
        if: github.event_name != 'schedule'
        env:
          MANUAL_MODE: ${{ inputs.mode || 'test' }}
        run: python -m src.main --mode "$MANUAL_MODE"

      - name: Upload scheduled episode to YouTube
        if: github.event_name == 'schedule' && env.YOUTUBE_TOKEN != ''
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          python - <<'PY'
          import json, glob, os
          from src.youtube_uploader import upload_video
          videos = glob.glob("output/*/video.mp4")
          if not videos:
              raise SystemExit("No generated video found.")
          video = videos[0]
          folder = os.path.dirname(video)
          meta = json.load(open(os.path.join(folder, "metadata.json"), encoding="utf-8"))
          video_id = upload_video(video, meta["title"], meta["description"], meta.get("tags", []), os.environ["YOUTUBE_TOKEN"], privacy_status="public", category_id="27")
          print("YOUTUBE_VIDEO_ID:", video_id)
          PY

      - name: Persist scheduled topic state
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/published.json
          if git diff --cached --quiet; then
            echo "No topic state changes to commit."
          else
            git commit -m "chore: record scheduled NABZ AI topic"
            git push
          fi

      - name: Verify generated artifacts
        run: |
          test -f output/*/video.mp4
          test -f output/*/thumbnail.jpg
          test -f output/*/quality.json
          python - <<'PY'
          import glob, json, os
          videos = glob.glob("output/*/video.mp4")
          assert videos, "No video artifact found"
          for video in videos:
              folder = os.path.dirname(video)
              report = json.load(open(os.path.join(folder, "quality.json"), encoding="utf-8"))
              assert report["visual_gate"] == "passed"
              assert report["story_structure_gate"] == "passed"
              assert report["video_codec"] == "h264"
              assert report["audio_codec"] == "aac"
              assert report["duration"] >= 120
          print("Artifact gate: PASS")
          PY

      - name: Upload preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nabz-ai-youtube-preview
          path: output/
          retention-days: 3
