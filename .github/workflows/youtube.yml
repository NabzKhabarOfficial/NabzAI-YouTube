name: NabzAI-YouTube
on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * *'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.main --mode test
      - uses: actions/upload-artifact@v4
        with:
          name: nabz-ai-youtube-preview
          path: output/
          retention-days: 3
